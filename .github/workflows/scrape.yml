# .github/workflows/scrape.yml
name: Scrape Events

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}       # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run main scraper (AllEvents, Townscript, Eventbrite, Meetup)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run scrape

      - name: Upload Eventbrite debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventbrite-debug
          path: backend/eventbrite-debug.png
          if-no-files-found: ignore

      - name: Run District scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run scrape:district